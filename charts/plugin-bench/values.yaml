# Keep at 1: run state and concurrency limits are local to each backend pod.
# Scale out only after adding shared storage and cross-pod coordination.
replicaCount: 1

# Allow time beyond the backend's 30-second shutdown timeout for Kubernetes cleanup.
terminationGracePeriodSeconds: 45

image:
  repository: ghcr.io/openeverest/plugin-bench
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  port: 8080

plugin:
  displayName: "Performance Benchmark"
  description: "Run and inspect PostgreSQL and MySQL benchmarks for OpenEverest database clusters."
  vendor: "OpenEverest"
  enabled: true
  bundlePath: "/main.js"
  icon: "/icon.png"
  extensionPoints:
    - type: route
      path: /performance-benchmark
      label: Performance Benchmark
    - type: sidebarItem
      label: Performance Benchmark
      icon: "/icon.png"
    - type: clusterDetailTab
      path: performance-benchmark
      label: Performance Benchmark
      providers:
        - provider-cloudnative-pg
        - provider-percona-postgresql
        - percona-server-mysql

everestAPIURL: ""

# Namespace used for benchmark Jobs and their temporary resources.
# An empty value uses the Helm release namespace.
workload:
  namespace: ""
  # Set to true only when the Helm installer is allowed to create the
  # configured workload namespace.
  createNamespace: false

# Compiled-in benchmark drivers and their runner images. Adding an entry does
# not install a driver implementation. At least one driver must remain enabled.
drivers:
  pgbench:
    enabled: true
    image:
      # Empty fields use legacy runner.image overrides for pgbench, then default
      # to ghcr.io/openeverest/plugin-bench-<driverID>, appVersion, IfNotPresent.
      repository: ""
      tag: ""
      pullPolicy: ""
  sysbench:
    # Enable only after publishing the runner image or supplying a usable image.
    enabled: false
    image:
      # Empty fields default to ghcr.io/openeverest/plugin-bench-sysbench,
      # appVersion, and IfNotPresent. Legacy runner.image affects pgbench only.
      repository: ""
      tag: ""
      pullPolicy: ""

# Shared configuration for benchmark Kubernetes Jobs.
runner:
  # Deprecated pgbench image overrides; prefer drivers.pgbench.image.
  # Explicit driver image fields take precedence over these legacy fields.
  image:
    repository: ""
    tag: ""
    pullPolicy: ""
  executionTimeout: 5m
  # Fail a run whose Pod stays unschedulable this long. Allow enough time for
  # node autoscaling. "0" disables early failure (executionTimeout still applies).
  schedulingGracePeriod: 2m
  # Applied to every runner Job, e.g. to target a dedicated benchmark node pool:
  #   nodeSelector:
  #     node-role/benchmark: "true"
  #   tolerations:
  #     - key: dedicated
  #       operator: Equal
  #       value: benchmark
  #       effect: NoSchedule
  # Per-run node affinity from the UI is applied in addition to these.
  nodeSelector: {}
  tolerations: []
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi
