# Keep at 1: run state and concurrency limits are local to each backend pod.
# Scale out only after adding shared storage and cross-pod coordination.
replicaCount: 1

# Allow time beyond the backend's 30-second shutdown timeout for Kubernetes cleanup.
terminationGracePeriodSeconds: 45

image:
  repository: ghcr.io/openeverest/plugin-bench
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  port: 8080

plugin:
  displayName: "Performance Benchmark"
  description: "Run and inspect PostgreSQL benchmarks for OpenEverest database clusters."
  vendor: "OpenEverest"
  enabled: true
  bundlePath: "/main.js"
  icon: "/icon.png"
  extensionPoints:
    - type: route
      path: /performance-benchmark
      label: Performance Benchmark
    - type: sidebarItem
      label: Performance Benchmark
      icon: "/icon.png"
    - type: clusterDetailTab
      path: performance-benchmark
      label: Performance Benchmark
      providers:
        - provider-cloudnative-pg
        - provider-percona-postgresql

everestAPIURL: ""

# Namespace used for benchmark Jobs and their temporary resources.
# An empty value uses the Helm release namespace.
workload:
  namespace: ""
  # Set to true only when the Helm installer is allowed to create the
  # configured workload namespace.
  createNamespace: false

# Configuration for the per-run pgbench Kubernetes Job.
runner:
  image:
    repository: ghcr.io/openeverest/plugin-bench-pgbench
    tag: ""
    pullPolicy: IfNotPresent
  executionTimeout: 5m
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi
