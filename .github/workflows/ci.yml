name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run test:form
      - run: npm run test:components
      - run: npm run test:submission
      - run: npm run test:status
      - run: npm run test:polling
      - run: npm run test:result
      - run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      # Run history integration tests use a disposable database and an
      # isolated schema per test.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bench
          POSTGRES_PASSWORD: bench
          POSTGRES_DB: bench
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bench -d bench"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PLUGIN_BENCH_TEST_POSTGRES_URI: postgres://bench:bench@localhost:5432/bench?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.mod
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: "3.14.0"
      - name: Download modules
        run: cd backend && go mod download
      - name: Create frontend embed placeholder
        run: mkdir -p backend/dist && touch backend/dist/main.js
      - run: cd backend && go vet ./...
      - run: cd backend && go test -race ./...
      - run: cd backend && go build -o /dev/null .

  runner:
    name: pgbench Runner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25"
          cache-dependency-path: runners/pgbench/go.mod
      - name: Vet runner
        run: cd runners/pgbench && go vet ./...
      - name: Test runner
        run: cd runners/pgbench && go test -race ./...
      - name: Build runner image
        run: docker build -t plugin-bench-pgbench:ci runners/pgbench
      - name: Integration test runner
        timeout-minutes: 3
        run: bash .github/scripts/test-runner.sh plugin-bench-pgbench:ci

  sysbench-runner:
    name: Sysbench Runner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25"
          cache-dependency-path: runners/sysbench/go.mod
      - name: Vet runner
        run: cd runners/sysbench && go vet ./...
      - name: Test runner
        run: cd runners/sysbench && go test -race ./...
      - name: Build runner image
        run: docker build -t plugin-bench-sysbench:ci runners/sysbench
      - name: Test credential encoding inside runner image
        timeout-minutes: 2
        working-directory: runners/sysbench
        run: |
          set -euo pipefail
          runner_test_binary="$RUNNER_TEMP/sysbench-runner.test"
          roundtrip_log="$RUNNER_TEMP/sysbench-roundtrip.log"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go test -c -o "$runner_test_binary" .
          docker run --rm --network none --entrypoint /tmp/sysbench-runner.test \
            --mount "type=bind,src=$runner_test_binary,dst=/tmp/sysbench-runner.test,readonly" \
            plugin-bench-sysbench:ci \
            -test.run '^TestConnectionConfigRoundTripsThroughSysbench$' -test.v \
            | tee "$roundtrip_log"
          grep -Fq -- '--- PASS: TestConnectionConfigRoundTripsThroughSysbench (' "$roundtrip_log"
          ! grep -q -- '--- SKIP' "$roundtrip_log"
      - name: Integration test runner
        timeout-minutes: 10
        run: bash .github/scripts/test-sysbench-runner.sh plugin-bench-sysbench:ci

  go-ycsb-runner:
    name: go-ycsb Runner
    # MongoDB 8.0 cannot start on the newer kernels in ubuntu-latest/24.04.
    # Keep its integration tests on the 22.04 runner's compatible kernel.
    # https://jira.mongodb.org/browse/SERVER-121912
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25"
          cache-dependency-path: runners/go-ycsb/go.sum
      - name: Vet runner
        run: cd runners/go-ycsb && go vet ./...
      - name: Test runner
        run: cd runners/go-ycsb && go test -race ./...
      - name: Build runner image
        run: docker build -t plugin-bench-go-ycsb:ci runners/go-ycsb
      - name: Integration test runner
        timeout-minutes: 20
        run: bash .github/scripts/test-go-ycsb-runner.sh plugin-bench-go-ycsb:ci

  hammerdb-runner:
    name: HammerDB Runner
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Make the real Tcl round-trip and phase tests mandatory rather than skipped.
      HAMMERDB_TEST_TCLSH: /usr/bin/tclsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25"
          cache-dependency-path: runners/hammerdb/go.mod
      - name: Install Tcl for script encoding and phase tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tcl
      - name: Vet runner
        run: cd runners/hammerdb && go vet ./...
      - name: Test runner
        run: cd runners/hammerdb && go test -race ./...
      - name: Build runner image
        timeout-minutes: 10
        run: docker build -t plugin-bench-hammerdb:ci runners/hammerdb
      - name: Check runner image startup and database libraries
        timeout-minutes: 3
        run: bash .github/scripts/check-hammerdb-image.sh plugin-bench-hammerdb:ci linux/amd64
      - name: Integration test runner against PostgreSQL and MySQL
        timeout-minutes: 30
        run: bash .github/scripts/test-hammerdb-runner.sh plugin-bench-hammerdb:ci

  helm-lint:
    name: Helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: "3.14.0"
      - run: helm lint charts/plugin-bench/
