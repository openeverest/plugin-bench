apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "plugin-bench.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "plugin-bench.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "plugin-bench.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "plugin-bench.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "plugin-bench.coordinatorServiceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.service.port | quote }}
            - name: WORKLOAD_NAMESPACE
              value: {{ include "plugin-bench.workloadNamespace" . | quote }}
            - name: RUNNER_SERVICE_ACCOUNT_NAME
              value: {{ include "plugin-bench.runnerServiceAccountName" . | quote }}
            - name: RUNNER_IMAGE
              value: {{ printf "%s:%s" .Values.runner.image.repository (.Values.runner.image.tag | default .Chart.AppVersion) | quote }}
            - name: RUNNER_IMAGE_PULL_POLICY
              value: {{ .Values.runner.image.pullPolicy | quote }}
            - name: BENCHMARK_EXECUTION_TIMEOUT
              value: {{ .Values.runner.executionTimeout | quote }}
            - name: RUNNER_CPU_REQUEST
              value: {{ .Values.runner.resources.requests.cpu | quote }}
            - name: RUNNER_MEMORY_REQUEST
              value: {{ .Values.runner.resources.requests.memory | quote }}
            - name: RUNNER_CPU_LIMIT
              value: {{ .Values.runner.resources.limits.cpu | quote }}
            - name: RUNNER_MEMORY_LIMIT
              value: {{ .Values.runner.resources.limits.memory | quote }}
            {{- if .Values.everestAPIURL }}
            - name: EVEREST_API_URL
              value: {{ .Values.everestAPIURL | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.service.port }}
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
