apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "plugin-bench.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "plugin-bench.labels" . | nindent 4 }}
spec:
  {{- if ne (int .Values.replicaCount) 1 }}
  {{- fail "replicaCount must be 1: startup recovery assumes a single backend owns the workload namespace" }}
  {{- end }}
  replicas: {{ .Values.replicaCount }}
  # Recreate stops the old backend, which records or fails its active runs,
  # before the new one starts and cleans up what was left behind.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "plugin-bench.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "plugin-bench.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "plugin-bench.coordinatorServiceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.service.port | quote }}
            # The cluster-scoped Plugin CR is named after the release, so the
            # release name uniquely identifies this installation.
            - name: BENCHMARK_INSTALLATION_ID
              value: {{ .Release.Name | quote }}
            - name: WORKLOAD_NAMESPACE
              value: {{ include "plugin-bench.workloadNamespace" . | quote }}
            - name: RUNNER_SERVICE_ACCOUNT_NAME
              value: {{ include "plugin-bench.runnerServiceAccountName" . | quote }}
            - name: BENCHMARK_DRIVERS
              value: {{ include "plugin-bench.driverConfig" . | quote }}
            - name: BENCHMARK_EXECUTION_TIMEOUT
              value: {{ .Values.runner.executionTimeout | quote }}
            - name: BENCHMARK_SCHEDULING_GRACE_PERIOD
              value: {{ .Values.runner.schedulingGracePeriod | quote }}
            - name: RUNNER_NODE_SELECTOR
              value: {{ .Values.runner.nodeSelector | default dict | toJson | quote }}
            - name: RUNNER_TOLERATIONS
              value: {{ .Values.runner.tolerations | default list | toJson | quote }}
            - name: RUNNER_CPU_REQUEST
              value: {{ .Values.runner.resources.requests.cpu | quote }}
            - name: RUNNER_MEMORY_REQUEST
              value: {{ .Values.runner.resources.requests.memory | quote }}
            - name: RUNNER_CPU_LIMIT
              value: {{ .Values.runner.resources.limits.cpu | quote }}
            - name: RUNNER_MEMORY_LIMIT
              value: {{ .Values.runner.resources.limits.memory | quote }}
            - name: BENCHMARK_STORAGE
              value: {{ .Values.storage.type | quote }}
            {{- if eq .Values.storage.type "postgresql" }}
            - name: BENCHMARK_STORAGE_POSTGRES_URI
              valueFrom:
                secretKeyRef:
                  name: {{ required "storage.postgresql.existingSecret is required when storage.type is postgresql" .Values.storage.postgresql.existingSecret | quote }}
                  key: {{ required "storage.postgresql.uriKey is required" .Values.storage.postgresql.uriKey | quote }}
            {{- else if ne .Values.storage.type "memory" }}
            {{- fail "storage.type must be memory or postgresql" }}
            {{- end }}
            {{- if .Values.everestAPIURL }}
            - name: EVEREST_API_URL
              value: {{ .Values.everestAPIURL | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.service.port }}
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
