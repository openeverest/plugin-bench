replicaCount: 1

image:
  repository: ghcr.io/openeverest/plugin-bench
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  port: 8080

plugin:
  displayName: "Performance Benchmark"
  description: "Run and inspect PostgreSQL benchmarks for OpenEverest database clusters."
  vendor: "OpenEverest"
  enabled: true
  bundlePath: "/main.js"
  extensionPoints:
    - type: route
      path: /performance-benchmark
      label: Performance Benchmark
    - type: clusterDetailTab
      path: performance-benchmark
      label: Performance Benchmark
      providers:
        - provider-cloudnative-pg
        - provider-percona-postgresql

everestAPIURL: ""

# Namespace used for benchmark Jobs and their temporary resources.
# An empty value uses the Helm release namespace.
workload:
  namespace: ""
  # Set to true only when the Helm installer is allowed to create the
  # configured workload namespace.
  createNamespace: false

resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi
